<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Animated quantum wave banner</title>
  <desc id="desc">Glowing particles orbit a quantum wave connecting physics, computation, and machine learning.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="0.5" stop-color="#111a33" />
      <stop offset="1" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" />
      <stop offset="0.5" stop-color="#bb9af7" />
      <stop offset="1" stop-color="#2ac3de" />
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <path id="orbit" d="M420 95a80 32 0 1 0 160 0a80 32 0 1 0-160 0" />
  </defs>

  <rect width="1000" height="190" rx="18" fill="url(#background)" />
  <g opacity="0.25" fill="#7aa2f7">
    <circle cx="90" cy="38" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite" /></circle>
    <circle cx="180" cy="145" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite" /></circle>
    <circle cx="805" cy="42" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite" /></circle>
    <circle cx="910" cy="142" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.4s" repeatCount="indefinite" /></circle>
  </g>

  <path d="M40 95 C120 20 200 170 280 95 S440 20 520 95 S680 170 760 95 S900 20 960 95"
        fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"
        stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M40 95 C120 170 200 20 280 95 S440 170 520 95 S680 20 760 95 S900 170 960 95"
        fill="none" stroke="#2ac3de" stroke-width="1.5" opacity="0.45" stroke-dasharray="6 12">
    <animate attributeName="stroke-dashoffset" values="0;36" dur="2.6s" repeatCount="indefinite" />
  </path>

  <g filter="url(#glow)">
    <circle r="6" fill="#ff9e64">
      <animateMotion dur="4s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit" /></animateMotion>
    </circle>
    <circle r="5" fill="#9ece6a">
      <animateMotion dur="4s" begin="-2s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit" /></animateMotion>
    </circle>
    <circle cx="500" cy="95" r="10" fill="#bb9af7">
      <animate attributeName="r" values="8;13;8" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;.65;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <g fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
    <text x="64" y="172">PHYSICS</text>
    <text x="455" y="172">COMPUTATION</text>
    <text x="826" y="172">INTUITION</text>
  </g>
</svg>
